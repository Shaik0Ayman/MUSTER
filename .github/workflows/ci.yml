name: ci
on: [push, pull_request]

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Host tests (C99)
        run: make -C firmware/test
      - name: Host tests (C++11)
        run: make -C firmware/test cpp
      - name: AVR footprint
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gcc-avr avr-libc
          make -C firmware/test avr

  examples:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        example: [lead_esp32, worker_esp32, worker_nano]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install platformio
      - run: pio run -d firmware/examples/${{ matrix.example }}

  toolchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq graphviz
      - run: pip install -e tools/muster-cli
      - name: Plan the quadruped example offline (baseline partitioner)
        run: muster plan tools/muster-cli/examples/quadruped/boards.yaml tools/muster-cli/examples/quadruped/main.cpp --offline --out /tmp/muster_out
