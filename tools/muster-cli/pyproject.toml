[project]
name = "muster-cli"
version = "0.1.0"
description = "Split one embedded program across many microcontroller boards"
requires-python = ">=3.9"
dependencies = ["pyyaml", "requests", "wireviz>=0.4"]

[project.scripts]
muster = "muster_cli.cli:main"

[tool.setuptools.package-data]
muster_cli = ["db/*.yaml"]
