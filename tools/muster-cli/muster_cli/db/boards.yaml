# Muster board database. Curated by hand, never generated by a model or assistant.
# The partitioner may only choose among what is listed here; the wiring
# generator only ever emits pins that appear here.

boards:
  esp32-s3-devkitc-1:
    name: ESP32-S3 DevKitC-1
    pio: { platform: espressif32, board: esp32-s3-devkitc-1, framework: arduino }
    logic_v: 3.3
    cores: 2
    ram_kb: 512
    clock_mhz: 240
    flags: [fpu, wifi, ble]
    can:
      native: true               # on-chip TWAI controller, still needs a PHY
      transceiver: sn65hvd230    # 3.3 V part
      pins: { tx: GPIO5, rx: GPIO4 }
    spi: { sck: GPIO12, miso: GPIO13, mosi: GPIO11, cs: GPIO10 }
    attention_pin: GPIO6
    power: { vcc: 3V3, gnd: GND }
    # muster.h defaults for this platform (firmware/src/muster.h, non-AVR branch).
    # Keep in sync: the validator sizes every call against the smallest board.
    runtime: { max_msg: 96, max_nodes: 8, max_tasks: 16 }

  nanoatmega328:
    name: Arduino Nano (ATmega328P)
    pio: { platform: atmelavr, board: nanoatmega328, framework: arduino }
    logic_v: 5.0
    cores: 1
    ram_kb: 2
    clock_mhz: 16
    flags: []
    can:
      native: false
      module: mcp2515_tja1050    # SPI CAN controller + 5 V PHY on one board
      pins: { sck: D13, miso: D12, mosi: D11, cs: D10, int: D2 }
    spi: { sck: D13, miso: D12, mosi: D11, cs: D9 }  # D10 taken by MCP2515
    attention_pin: D3
    power: { vcc: 5V, gnd: GND }
    runtime: { max_msg: 40, max_nodes: 4, max_tasks: 16 }   # muster.h __AVR__ defaults

modules:
  sn65hvd230:
    name: SN65HVD230 CAN transceiver
    logic_v: 3.3
    pins: [3V3, GND, CTX, CRX, CANH, CANL]
  mcp2515_tja1050:
    name: MCP2515 + TJA1050 CAN module
    logic_v: 5.0
    pins: [VCC, GND, CS, SO, SI, SCK, INT, CANH, CANL]
