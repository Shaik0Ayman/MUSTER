; Muster portability self-test: one sketch, one env per board, across MCU families.
; `pio run -d firmware/examples/portability -e <env>` builds one board;
; `pio run -d firmware/examples/portability` builds them all (downloads each toolchain).
; Flash any of them and open the serial monitor at 115200: it prints
; MUSTER SELFTEST: PASS/FAIL every 10 s. Results and status: docs/BOARDS.md.
[platformio]
default_envs = uno

[env]
framework = arduino
monitor_speed = 115200
lib_deps = symlink://../../

; ---------------- Microchip AVR (8-bit)
[env:uno]
platform = atmelavr
board = uno
[env:nano]
platform = atmelavr
board = nanoatmega328
[env:mega2560]
platform = atmelavr
board = megaatmega2560
[env:nano_every]
platform = atmelmegaavr
board = nano_every

; ---------------- Espressif
[env:esp32]
platform = espressif32@6.9.0
board = esp32dev
[env:esp32_s3]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
[env:esp32_c3]
platform = espressif32@6.9.0
board = esp32-c3-devkitm-1
[env:esp32_s2]
platform = espressif32@6.9.0
board = esp32-s2-saola-1
[env:esp8266]
platform = espressif8266
board = nodemcuv2

; ---------------- STMicroelectronics STM32 (STM32duino core)
[env:bluepill_f103]
platform = ststm32
board = bluepill_f103c8
[env:blackpill_f411]
platform = ststm32
board = blackpill_f411ce
[env:nucleo_f446]
platform = ststm32
board = nucleo_f446re
[env:nucleo_g431]
platform = ststm32
board = nucleo_g431rb

; ---------------- Raspberry Pi RP2040
[env:pico]
platform = raspberrypi
board = pico

; ---------------- Nordic nRF52
[env:nano33ble]
platform = nordicnrf52
board = nano33ble

; ---------------- Microchip SAM (ARM Cortex-M)
[env:zero_samd21]
platform = atmelsam
board = zeroUSB
[env:metro_m4_samd51]
platform = atmelsam
board = adafruit_metro_m4
[env:due_sam3x]
platform = atmelsam
board = due

; ---------------- NXP (Teensy: i.MX RT1062 and Kinetis)
[env:teensy41]
platform = teensy
board = teensy41
[env:teensy36]
platform = teensy
board = teensy36
[env:teensylc]
platform = teensy
board = teensylc
build_flags = -DSELFTEST_BOARDS=2   ; 8 KB RAM: three boards overflow by ~280 B, so lead + one worker

; ---------------- Renesas RA (Arduino UNO R4)
[env:uno_r4_minima]
platform = renesas-ra
board = uno_r4_minima
