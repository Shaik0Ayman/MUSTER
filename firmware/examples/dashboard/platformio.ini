; Muster dashboard example: an ESP32 lead with telemetry, over ESP-NOW.
; Workers: the trio example's worker image (firmware/examples/trio, env worker_esp32).
;
;   pio run -e lead_serial -t upload      ; dashboard hosted on your PC:
;                                         ;   muster dash --serial COM5 --open
;   pio run -e lead_wifi   -t upload      ; the lead hosts the page itself:
;                                         ;   join WiFi "muster-dash" (muster123), open http://192.168.4.1/
;
; Compiles; NOT yet run on hardware.
[platformio]
default_envs = lead_serial

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = symlink://../../
build_flags = -DCORE_DEBUG_LEVEL=0

[env:lead_serial]

[env:lead_wifi]
build_flags = ${env.build_flags} -DDASH_ON_BOARD
