[env:worker_nano]
platform = atmelavr
board = nanoatmega328      ; use nanoatmega328new if your Nano has the new bootloader
framework = arduino
monitor_speed = 115200
lib_deps =
    symlink://../../
    autowp/autowp-mcp2515  ; verify registry name with: pio pkg search mcp2515
build_flags = -I../common
