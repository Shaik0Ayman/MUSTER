[env:worker_esp32]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps = symlink://../../
build_flags = -I../common

; Same board, plus the SPI link to the lead (ROADMAP M5, not yet verified on hardware)
[env:worker_esp32_spi]
extends = env:worker_esp32
build_flags = -I../common -DMUSTER_DEMO_SPI
