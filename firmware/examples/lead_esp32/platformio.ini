[env:lead_esp32]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps = symlink://../../
build_flags = -I../common

; Same board, plus the SPI link to worker 1 (ROADMAP M5, not yet verified on hardware)
[env:lead_esp32_spi]
extends = env:lead_esp32
build_flags = -I../common -DMUSTER_DEMO_SPI
