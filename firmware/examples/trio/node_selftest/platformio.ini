; Per-board self-test (node_selftest.ino). No Muster library needed.
;   pio run -e selftest_esp32 -t upload     ; each classic ESP32 DevKit
;   pio run -e selftest_c6    -t upload     ; the ESP32-C6 (needs the pioarduino platform, see ../platformio.ini)
[platformio]
src_dir = .

[env]
framework = arduino
monitor_speed = 115200
build_flags = -DCORE_DEBUG_LEVEL=0

[env:selftest_esp32]
platform = espressif32@6.9.0
board = esp32dev

[env:selftest_c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c6-devkitc-1
; COM port is the C6's native USB ("USB JTAG/serial"): Serial needs USB CDC on boot to show up there.
; If you use the UART-labelled port instead, delete this line.
build_flags = ${env.build_flags} -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
