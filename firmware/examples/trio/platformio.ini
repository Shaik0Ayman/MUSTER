; Muster trio demo: one lead (ESP32-C6) + two workers (any classic ESP32 DevKit).
; The link is ESP-NOW - no CAN transceivers needed.
;
;   pio run -e worker_esp32 -t upload      ; flash this to BOTH DevKits (same image)
;   pio run -e lead_c6      -t upload      ; flash this to the ESP32-C6
;
; Per-board check with no Muster in it (run it first): see node_selftest/platformio.ini.
;
; The C6 needs Arduino-ESP32 3.x, which the stock "espressif32" platform does not
; ship; that is why lead_c6 uses the pioarduino fork of the platform. The classic
; ESP32 envs use the stock platform (Arduino-ESP32 2.0.x) and also build on 3.x.
[platformio]
src_dir = muster_trio

[env]
framework = arduino
monitor_speed = 115200
lib_deps = symlink://../../
build_flags = -DCORE_DEBUG_LEVEL=0

[env:worker_esp32]
platform = espressif32@6.9.0
board = esp32dev

[env:lead_c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c6-devkitc-1
; COM port is the C6's native USB ("USB JTAG/serial"): Serial needs USB CDC on boot to show up there.
; If you use the UART-labelled port instead, delete this line.
build_flags = ${env.build_flags} -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

; The lead role on a classic ESP32: handy if the C6 toolchain gives trouble, or to
; check the lead code without the C6. Not part of the intended 3-board setup.
[env:lead_esp32dev]
platform = espressif32@6.9.0
board = esp32dev
build_flags = ${env.build_flags} -DTRIO_ROLE_LEAD
