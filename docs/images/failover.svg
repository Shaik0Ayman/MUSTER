<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-labelledby="t d">
  <title id="t">Failover in three panels</title>
  <desc id="d">1: the lead sends a call to worker A. 2: worker A is unplugged and goes silent. 3: the lead declares it lost and resends the call to worker B, which answers.</desc>
  <defs>
    <symbol id="lead" viewBox="0 0 100 70">
      <path d="M36 16 l6 -14 l8 9 l8 -9 l6 14 z" fill="#ffd166" stroke="#7a5200" stroke-width="1.5"/>
      <rect x="4" y="18" width="92" height="48" rx="10" fill="#b7791f"/>
      <text x="50" y="49" font-family="'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="700" fill="#fff7e6" text-anchor="middle">lead</text>
    </symbol>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e2e8f0"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7CFFB2"/></marker>
  </defs>
  <rect width="1200" height="330" rx="24" fill="#111a30"/>

  <g font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
    <!-- panel frames -->
    <g fill="#16213d" stroke="#26324d" stroke-width="2">
      <rect x="24" y="24" width="370" height="282" rx="18"/>
      <rect x="415" y="24" width="370" height="282" rx="18"/>
      <rect x="806" y="24" width="370" height="282" rx="18"/>
    </g>
    <g font-size="20" font-weight="700" fill="#ffffff">
      <text x="48" y="62">1 · Call goes out</text>
      <text x="439" y="62">2 · Worker A ghosts</text>
      <text x="830" y="62">3 · Lead moves on</text>
    </g>

    <!-- panel 1 -->
    <use href="#lead" x="60" y="140" width="100" height="70"/>
    <rect x="260" y="96" width="110" height="50" rx="10" fill="#14b8a6"/>
    <text x="315" y="127" font-size="16" fill="#fff" text-anchor="middle">worker A</text>
    <rect x="260" y="200" width="110" height="50" rx="10" fill="#14b8a6"/>
    <text x="315" y="231" font-size="16" fill="#fff" text-anchor="middle">worker B</text>
    <path d="M160 168 C200 150 220 128 254 122" stroke="#e2e8f0" stroke-width="3" fill="none" marker-end="url(#a)"/>
    <rect x="150" y="84" width="74" height="26" rx="13" fill="#26324d"/>
    <text x="187" y="102" font-size="14" fill="#e2e8f0" text-anchor="middle">call #7</text>
    <text x="48" y="286" font-size="15" fill="#8d97b5">A was the best pick, so A gets it.</text>

    <!-- panel 2 -->
    <use href="#lead" x="451" y="140" width="100" height="70"/>
    <g opacity="0.45">
      <rect x="651" y="96" width="110" height="50" rx="10" fill="#475569"/>
      <text x="706" y="127" font-size="16" fill="#fff" text-anchor="middle">worker A</text>
    </g>
    <!-- unplugged cable -->
    <path d="M706 146 v20" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
    <path d="M706 182 v16" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
    <path d="M694 170 l24 8" stroke="#f87171" stroke-width="3" stroke-linecap="round"/>
    <text x="772" y="112" font-size="26" fill="#94a3b8">z</text><text x="760" y="96" font-size="18" fill="#94a3b8">z</text>
    <rect x="651" y="200" width="110" height="50" rx="10" fill="#14b8a6"/>
    <text x="706" y="231" font-size="16" fill="#fff" text-anchor="middle">worker B</text>
    <!-- clock -->
    <circle cx="600" cy="108" r="22" fill="#26324d" stroke="#e2e8f0" stroke-width="2"/>
    <path d="M600 108 v-13 M600 108 l10 6" stroke="#f5b942" stroke-width="3" stroke-linecap="round"/>
    <text x="439" y="270" font-size="15" fill="#8d97b5">No answer, no heartbeat. The lead</text>
    <text x="439" y="290" font-size="15" fill="#8d97b5">waits for the timeout, then calls it lost.</text>

    <!-- panel 3 -->
    <use href="#lead" x="842" y="140" width="100" height="70"/>
    <g opacity="0.45">
      <rect x="1042" y="96" width="110" height="50" rx="10" fill="#475569"/>
      <text x="1097" y="127" font-size="16" fill="#fff" text-anchor="middle">A · lost</text>
    </g>
    <rect x="1042" y="200" width="110" height="50" rx="10" fill="#14b8a6" stroke="#7CFFB2" stroke-width="4"/>
    <text x="1097" y="231" font-size="16" fill="#fff" text-anchor="middle" font-weight="700">worker B</text>
    <path d="M942 186 C980 205 1000 222 1036 224" stroke="#7CFFB2" stroke-width="3" fill="none" marker-end="url(#g)"/>
    <rect x="950" y="150" width="84" height="26" rx="13" fill="#14403a"/>
    <text x="992" y="168" font-size="14" fill="#9cf2e4" text-anchor="middle">call #7 done</text>
    <text x="830" y="286" font-size="15" fill="#8d97b5">Same call, new board. A rejoins later.</text>
  </g>
</svg>
